[pytest]
# Configuración de pytest para el lab de QA Web UI
# --alluredir: carpeta donde se guardan los resultados crudos de Allure
# --headed se omite a propósito: por defecto corre headless (ideal para CI)
addopts = --alluredir=allure-results --clean-alluredir -v
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: pruebas rápidas de humo
    regression: pruebas de regresión
