<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Vuelos - QA Lab</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; margin: 40px; background: #f5f7fa; }
    .card { max-width: 480px; margin: auto; background: #fff; padding: 24px 28px;
            border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-size: 13px; color: #555; }
    input, button { width: 100%; padding: 10px 12px; font-size: 14px;
                    border: 1px solid #cbd2d9; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 18px; background: #2563eb; color: #fff; border: none;
             cursor: pointer; font-weight: 600; }
    button:disabled { background: #9db4e8; cursor: not-allowed; }
    .result { margin-top: 18px; padding: 12px; border-radius: 8px;
              background: #ecfdf5; color: #065f46; font-size: 14px; display: none; }
    .error { background: #fef2f2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 data-testid="page-heading">Buscador de Vuelos</h1>
    <form data-testid="flight-search-form">
      <label for="origin">Origen</label>
      <input data-testid="origin-input" id="origin" type="text" placeholder="Ej. Bogotá" />

      <label for="destination">Destino</label>
      <input data-testid="destination-input" id="destination" type="text" placeholder="Ej. Madrid" />

      <button data-testid="search-button" type="submit">Buscar vuelos</button>
    </form>

    <div data-testid="search-result" class="result"></div>
  </div>

  <script>
    const form = document.querySelector('[data-testid="flight-search-form"]');
    const origin = document.querySelector('[data-testid="origin-input"]');
    const destination = document.querySelector('[data-testid="destination-input"]');
    const result = document.querySelector('[data-testid="search-result"]');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      result.style.display = 'block';
      if (!origin.value.trim() || !destination.value.trim()) {
        result.classList.add('error');
        result.textContent = 'Debes ingresar origen y destino.';
        return;
      }
      result.classList.remove('error');
      result.textContent = `Buscando vuelos de ${origin.value.trim()} a ${destination.value.trim()}...`;
    });
  </script>
</body>
</html>
